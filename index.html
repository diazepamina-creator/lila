<style>

  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--fondo);color:var(--texto);font:400 18px/1.4 var(--letra);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
body.cargando{visibility:hidden}
[hidden]{display:none!important}
button{font-family:var(--letra)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid var(--verde);outline-offset:3px}

.pantalla{position:fixed;inset:0;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}

.boton{font:700 clamp(26px,4vh,38px)/1 var(--letra);min-height:80px;padding:0 40px;border-radius:22px;
  border:3px solid var(--verde);background:var(--verde-claro);color:#26331F;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:16px;letter-spacing:.02em}
.picto{display:inline-flex;width:56px;height:56px;flex:none}

.escena{display:grid;grid-template-rows:minmax(0,1fr) auto auto;justify-items:center;align-items:center;gap:clamp(12px,3vh,28px)}
.escena svg{width:min(100%,900px);height:100%;max-height:68vh}

.titulo-final{font:700 clamp(30px,5.5vh,52px)/1.1 var(--letra);color:var(--texto);margin:0;letter-spacing:.03em;text-align:center}

#juego{display:grid;gap:clamp(8px,1.6vh,18px) clamp(10px,2vw,28px);
  grid-template-columns:minmax(120px,19%) minmax(0,1fr) minmax(120px,19%);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"prog prog prog" "lila suma suma" "lila resp sig"}
.progreso{grid-area:prog;display:flex;justify-content:center;gap:16px;padding-top:6px}
.punto{width:28px;height:28px;border-radius:50%;border:3px solid var(--pelo-osc);background:transparent}
.punto.lleno{background:var(--hoja);border-color:var(--hoja-linea)}
.suma{grid-area:suma;min-height:0;min-width:0;display:flex}
#ejercicio{width:100%;height:100%;display:block}
.lila{grid-area:lila;align-self:end;justify-self:start;width:100%;max-width:230px}
.lila svg{display:block;width:100%;height:auto}
.respuestas{grid-area:resp;display:flex;justify-content:center;align-items:center;gap:clamp(14px,3vw,44px);padding-bottom:6px}
.siguiente{grid-area:sig;align-self:center;justify-self:end;display:grid}
.siguiente .boton{padding:0 26px;grid-area:1/1}
.boton:disabled{border-color:var(--apagado-borde);color:var(--apagado);background:transparent;cursor:default}
#confeti{grid-area:suma;position:relative;pointer-events:none;overflow:hidden}
#confeti i{position:absolute;left:50%;top:42%;width:12px;height:16px;border-radius:3px;opacity:0;
  animation:confeti .8s ease-out 1 both}
@keyframes confeti{0%{transform:translate(0,0) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--g));opacity:0}}
.elige{cursor:pointer;outline:none}
.elige .zona{fill:transparent}
.elige .tarima{fill:var(--verde-claro);stroke:var(--verde);stroke-width:4.5;visibility:hidden}
.elige[aria-pressed=true] .tarima{visibility:visible}
.elige:focus-visible .zona{stroke:var(--verde);stroke-width:5;stroke-dasharray:10 8}
body[data-estacion=otono] .con-estacion{--hoja:#C9B47F;--hoja2:#B89C66;--suelo:#EADCC0}
body[data-estacion=verano] .con-estacion{--suelo:var(--arena)}
.mar{fill:var(--mar)}
.oc{stroke:var(--linea);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.oto1{fill:var(--flor-o)}.oto2{fill:var(--pan)}.oto3{fill:var(--zorro)}
.pelo-zorro{--pelo:var(--zorro);--pelo-osc:var(--zorro-osc)}
.pelo-erizo{--pelo:var(--erizo);--pelo-osc:var(--erizo-pua);--pecho:var(--erizo-osc)}
.cuenta{fill:var(--tenue)}
.oculto{visibility:hidden}

.opcion{font:700 clamp(36px,7.2vh,58px)/1 var(--letra);font-variant-numeric:tabular-nums;
  min-height:max(76px,12.5vh);min-width:max(92px,10.5vw);padding:0 14px;border-radius:18px;
  border:3px solid var(--linea);background:var(--ficha);color:var(--cifra);cursor:pointer;touch-action:none}
.opcion:disabled{cursor:default}
.opcion.fallada{border-color:var(--apagado-borde);color:var(--apagado);
  background:linear-gradient(to top right,transparent calc(50% - 3px),var(--tacha) calc(50% - 3px),var(--tacha) calc(50% + 3px),transparent calc(50% + 3px)),var(--fondo)}
.opcion.expresion{font-size:clamp(26px,5.2vh,44px);white-space:nowrap;padding:0 18px}
.opcion.arrastrando{position:relative;z-index:5;box-shadow:none}
.opcion.volviendo{transition:transform .45s ease-in-out}

.cifra{font-family:var(--letra);font-weight:700;fill:var(--cifra);text-anchor:middle}
.nombre{font-family:var(--letra);font-weight:700;fill:var(--tinta);text-anchor:middle;letter-spacing:.04em}
.etiqueta{font-family:var(--letra);font-weight:700;fill:var(--tenue);text-anchor:middle}
.raya{stroke:var(--linea);stroke-width:4;stroke-linecap:round;fill:none}
.raya-fina{stroke:var(--linea);stroke-width:2;stroke-linecap:round;fill:none;opacity:.35}
.casilla{fill:var(--ficha);stroke:var(--linea);stroke-width:2.4}
.tablero{fill:var(--tablero)}

#engranaje{position:fixed;z-index:10;top:max(6px,env(safe-area-inset-top));right:max(6px,env(safe-area-inset-right));
  width:48px;height:48px;padding:6px;border:0;background:transparent;opacity:.5;cursor:pointer;touch-action:none}
#engranaje svg{width:100%;height:100%;display:block;overflow:visible}
#engranaje .anillo{fill:none;stroke:var(--verde);stroke-width:3;stroke-dasharray:101;stroke-dashoffset:101;transform:rotate(-90deg);transform-origin:18px 18px}
#engranaje.pulsando{opacity:.9}
#engranaje.pulsando .anillo{transition:stroke-dashoffset 3s linear;stroke-dashoffset:0}

#panel{width:min(560px,94vw);max-width:none;max-height:92vh;border:2px solid var(--linea);border-radius:18px;padding:0;background:var(--ficha);color:var(--texto);-webkit-user-select:text;user-select:text}
#panel::backdrop{background:rgba(46,51,44,.35)}
#panel form{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:20px 22px 22px;font-size:17px}
#panel h2{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
#panel fieldset{min-width:0;border:1px solid var(--apagado-borde);border-radius:12px;margin:0;padding:8px 12px 10px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
#panel legend{font-weight:700;padding:0 4px}

#panel .fila-nivel{display:flex;flex-wrap:wrap;gap:6px 12px}
#panel .fila-nivel select{flex:1 1 13em;min-width:0}
#panel select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--linea);background:#fff;max-width:100%}
#panel input[type=radio],#panel input[type=checkbox]{width:22px;height:22px;accent-color:var(--verde)}
#panel input[type=color]{width:52px;height:36px;border:1px solid var(--linea);border-radius:8px;padding:2px;background:#fff}
#panel .pequeno{font:inherit;font-size:15px;padding:6px 10px;border-radius:8px;border:1px solid var(--linea);background:#fff;cursor:pointer}
#panel .muestra{width:100%;height:34px}
#panel .nota{margin:0;font-size:14px;color:var(--tenue)}
#panel .cerrar{justify-self:end;font-size:22px;min-height:56px;padding:0 28px}

@media (orientation:portrait){
  #juego{grid-template-columns:minmax(0,min(140px,32vw)) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
    grid-template-areas:"prog prog" "suma suma" "resp resp" "lila sig"}
  .lila{max-width:140px}
  .siguiente{min-width:0;max-width:100%}
  .siguiente .boton{font-size:clamp(20px,6.2vw,34px);padding:0 clamp(12px,3.5vw,26px);gap:10px;max-width:100%}
  .siguiente .picto{width:clamp(36px,10vw,56px);height:clamp(36px,10vw,56px)}
  .respuestas{gap:clamp(10px,3vw,24px)}
  .opcion{min-width:0;flex:0 1 92px;min-height:80px;font-size:clamp(34px,10vw,52px)}
  .opcion.expresion{font-size:clamp(17px,5.4vw,40px);padding:0 4px}
  .escena svg{max-height:56vh}
  .titulo-final{font-size:clamp(26px,8vw,46px)}
}

@keyframes cola{0%{transform:rotate(0)}36%{transform:rotate(30deg);animation-timing-function:ease-in-out}100%{transform:rotate(0)}}
@keyframes orejas{0%{transform:translateY(0)}36%{transform:translateY(-4.5px);animation-timing-function:ease-in-out}100%{transform:translateY(0)}}
.actriz.gesto .cola{animation:cola .7s ease-out 1}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  for (let j = 0; j < db; j++) { const p = enB.barra(j); pasos.push({ barra: true, g: barraMovil(svg, p.x, p.y, c, tumbada) }); }
  for (let i = 0; i < ub; i++) { const p = enB.suelto(i); pasos.push({ barra: false, g: cubo(svg, p.x, p.y, c) }); }

  let hechos = 0, barras = da, valor = ej.a;
  const escribe = () => { cuenta.textContent = hechos ? String(valor) : ''; };
  async function agrupa(ms) {
    const sitio = enA.barra(barras);
    await Promise.all(sueltosA.map((g, k) => tumbada ? mueve(g, sitio.x + c * (-108 + 24 * k), sitio.y, ms)
                                                     : mueve(g, sitio.x, sitio.y + c * (108 - 24 * k), ms)));
    const nueva = barraDe(svg, sitio.x, sitio.y, c, tumbada);
    nueva.style.opacity = 0;
    await Promise.all([funde(nueva, 0, 1, ms / 2), ...sueltosA.map(g => funde(g, 1, 0, ms / 2))]);
    sueltosA.forEach(g => g.remove());
    sueltosA.length = 0;
    barras++;
  }
  const llega = (p, ms) => {
    if (p.barra) { const s = enA.barra(barras++); return mueve(p.g, s.x, s.y, ms); }
    const s = enA.suelto(sueltosA.length); sueltosA.push(p.g); return mueve(p.g, s.x, s.y, ms);
  };
  return {
    tapa: marco.tapa,
    modelo: {
      quedan: () => pasos.length - hechos,
      hechos: () => hechos,
      valor: () => valor,
      async paso() {
        const p = pasos[hechos++];
        valor += p.barra ? 10 : 1;
        await llega(p, 380);
        escribe();
        if (sueltosA.length === 10) await agrupa(450);
        return valor;
      },
      async termina() {
        const resto = pasos.slice(hechos);
        hechos = pasos.length; valor = ej.r;
        const sueltos = resto.filter(p => !p.barra), hastaDiez = Math.min(sueltos.length, 10 - sueltosA.length);
        await Promise.all([...resto.filter(p => p.barra), ...sueltos.slice(0, hastaDiez)].map(p => llega(p, 500)));
        if (sueltosA.length === 10) { await agrupa(450); await Promise.all(sueltos.slice(hastaDiez).map(p => llega(p, 380))); }
        escribe();
      },
    },
  };
}

function dibujaTabla(svg, ej, aj, vertical) {
  const F = 100;
  const paso = 1.5 * F;
  if (vertical) return dibujaTablaVertical(svg, ej, F, 1.6, paso);
  const c = 1.3, alturaTorre = 24 * 5 * c;
  const x0 = 30 + 0.31 * F;
  const altoFila = 0.74 * F + 40 + alturaTorre + 28;
  const base = fila => 26 + fila * altoFila + 0.74 * F;
  const primeraFila = ej.m > 5 ? 0 : 1;
  for (let i = 0; i < ej.m; i++) {
    const fila = primeraFila + Math.floor(i / 5), x = x0 + (i % 5) * paso;

function dibujaTablaVertical(svg, ej, F, c, paso) {
  const ancho = 4 * paso + 0.62 * F + 0.62 * F + 60;

let sinMovimiento = false;
const quieto = () => sinMovimiento || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let animando = 0;
const espera = ms => quieto() ? Promise.resolve() : new Promise(res => setTimeout(res, ms));
const suave = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function mueve(g, x, y, ms) {
  const x0 = g._x, y0 = g._y;
  g._x = x; g._y = y;
  if (quieto() || ms <= 0) { g.setAttribute('transform', `translate(${r1(x)} ${r1(y)})`); return Promise.resolve(); }
  animando++;
  return new Promise(res => {
    const t0 = performance.now();
    const paso = ahora => {
      const t = Math.min(1, (ahora - t0) / ms), e = suave(t);
      g.setAttribute('transform', `translate(${r1(x0 + (x - x0) * e)} ${r1(y0 + (y - y0) * e)})`);
      if (t < 1) requestAnimationFrame(paso); else { animando--; res(); }
    };
    requestAnimationFrame(paso);
  });
}
function funde(e, de, a, ms) {
  if (quieto() || ms <= 0) { e.style.opacity = a; return Promise.resolve(); }
  animando++;
  return new Promise(res => {
    const t0 = performance.now();
    const paso = ahora => {
      const t = Math.min(1, (ahora - t0) / ms);
      e.style.opacity = de + (a - de) * suave(t);
      if (t < 1) requestAnimationFrame(paso); else { animando--; res(); }
    };
    requestAnimationFrame(paso);
  });
}

let ultimaAccion = -Infinity;

function sobreLaHuella(x, y) {

  if (!tapa || tapa.getAttribute('visibility') === 'hidden') return false;
  const r = tapa.getBoundingClientRect(), m = 24;
  return x >= r.left - m && x <= r.right + m && y >= r.top - m && y <= r.bottom + m;
}
function preparaArrastre(b) {

    const sigue = e => { b.style.transform = `translate(${e.clientX - x0}px, ${e.clientY - y0}px)`; };
    const suelta = e => {
      b.removeEventListener('pointermove', sigue);

    for (const r of f.elements[nombre]) r.checked = r.value === String(ajustes[nombre]);
  $('aj-objeto').value = ajustes.objeto;
  $('aj-color-unidad').value = ajustes.colorUnidad;
  $('aj-color-decena').value = ajustes.colorDecena;
  $('aj-color-centena').value = ajustes.colorCentena;
  $('aj-personaje').value = ajustes.personaje;
  $('aj-estacion').value = ajustes.estacion;
  $('aj-voz').checked = ajustes.voz;
  $('aj-portada').checked = ajustes.portada;
  $('aj-mayusculas').checked = ajustes.mayusculas;
  $('aj-pictogramas').checked = ajustes.pictogramas;
  $('aj-pantalla-completa').checked = ajustes.pantallaCompleta;
  ajustaPanel();
  $('panel').showModal();
}
function ajustaPanel() {
  const n = ajustes.nivel;
  $('fs-contar').hidden = n !== 0;
  $('fs-tabla').hidden = n !== 6;
  $('fs-objeto').hidden = n > 1;
  $('aj-objeto').querySelector('[value=policubo]').disabled = n === 1;
  const hayPictos = Object.values(PICTOGRAMAS).some(v => v.trim() !== '');
  $('atribucion').hidden = !(ajustes.pictogramas && hayPictos);
  $('sin-pictos').hidden = !(ajustes.pictogramas && !hayPictos);
}
function leePanel() {
  const f = $('panel-form');
  const radio = nombre => { for (const r of f.elements[nombre]) if (r.checked) return r.value; return null; };
  ajustes.nivel = Number($('aj-nivel').value);
  ajustes.contarHasta = Number(radio('contarHasta')) || 5;
  ajustes.tabla = radio('tabla') || 'las-dos';
  ajustes.respuesta = radio('respuesta') || 'tocar';
  ajustes.barra = radio('barra') || 'tumbada';
  ajustes.objeto = $('aj-objeto').value;
  ajustes.colorUnidad = $('aj-color-unidad').value;
  ajustes.colorDecena = $('aj-color-decena').value;
  ajustes.colorCentena = $('aj-color-centena').value;
  ajustes.personaje = $('aj-personaje').value;
  ajustes.estacion = $('aj-estacion').value;
  ajustes.voz = $('aj-voz').checked;
  ajustes.portada = $('aj-portada').checked;
  ajustes.mayusculas = $('aj-mayusculas').checked;
  ajustes.pictogramas = $('aj-pictogramas').checked;
  ajustes.pantallaCompleta = $('aj-pantalla-completa').checked;
  normaliza(ajustes);
  guardaAjustes(ajustes);
  aplicaAspecto();
  ajustaPanel();
}
function cierraPanel() {
  const cambia = ajustesAlAbrir && CAMBIAN_LA_SESION.some(k => ajustesAlAbrir[k] !== ajustes[k]);
  ajustesAlAbrir = null;
  if (cambia && !$('juego').hidden) empiezaSesion();
}

function aplicaAspecto() {
  const alumno = s => ajustes.mayusculas ? s.toLocaleUpperCase('es') : s;
  document.querySelectorAll('[data-texto]').forEach(e => {
    const s = TEXTOS[e.dataset.texto] || '';
    e.textContent = e.hasAttribute('data-alumno') ? alumno(s) : s;
  });
  document.querySelectorAll('[data-texto-aria]').forEach(e => e.setAttribute('aria-label', TEXTOS[e.dataset.textoAria]));
  document.documentElement.style.setProperty('--unidad', ajustes.colorUnidad);
  document.documentElement.style.setProperty('--decena', ajustes.colorDecena);
  document.documentElement.style.setProperty('--centena', ajustes.colorCentena);
  pintaEscenas();
  document.querySelectorAll('[data-picto]').forEach(e => {
    const fuente = PICTOGRAMAS[e.dataset.picto] || '';
    const ver = ajustes.pictogramas && fuente.trim() !== '';
    e.hidden = !ver;
    if (!ver) { e.replaceChildren(); return; }
    if (fuente.trim().startsWith('<svg')) e.innerHTML = fuente;
    else { const img = document.createElement('img'); img.src = fuente; img.alt = ''; e.replaceChildren(img); }
  });
}

function arranca() {
  ajustes = leeAjustes();
  const semilla = Number(new URLSearchParams(location.search).get('semilla'));
  azar = nuevoAzar(semilla || (Date.now() % 2147483647));
  aplicaAspecto();
  preparaEngranaje();
  $('b-empezar').addEventListener('click', () => { if (permitido()) { pantallaCompleta(); empiezaSesion(); } });
  $('b-siguiente').addEventListener('click', () => { if (permitido()) siguiente(); });
  $('b-contar').addEventListener('click', () => { if (permitido()) cuenta(); });
  const portada = $('escena-de-portada');
  portada.addEventListener('click', ev => { const g = ev.target.closest('.elige'); if (g) eligePersonaje(g.dataset.personaje); });
  portada.addEventListener('keydown', ev => {
    const g = ev.target.closest('.elige');
    if (g && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); eligePersonaje(g.dataset.personaje); }
  });
  $('aj-colores-iniciales').addEventListener('click', () => {
    $('aj-color-unidad').value = AJUSTES_INICIALES.colorUnidad; $('aj-color-decena').value = AJUSTES_INICIALES.colorDecena;
    $('aj-color-centena').value = AJUSTES_INICIALES.colorCentena; leePanel();
  });
  $('b-otra').addEventListener('click', () => { if (permitido()) { pantallaCompleta(); empiezaSesion(); } });
  preparaTablet();
  $('panel-form').addEventListener('input', leePanel);
  $('panel-form').addEventListener('change', leePanel);
  $('panel').addEventListener('close', cierraPanel);
  window.matchMedia('(orientation: portrait)').addEventListener('change', () => { pintaEscenas(); repinta(); });
  inicio();
  document.body.classList.remove('cargando');
}
document.addEventListener('DOMContentLoaded', () => {
  const lista = document.fonts ? Promise.all([document.fonts.load('700 40px "Lila Letra"'), document.fonts.load('400 18px "Lila Letra"')]) : Promise.resolve();
  Promise.race([lista, new Promise(res => setTimeout(res, 1500))]).then(arranca, arranca);
});

window.lila = { generaEjercicio, generaSesion, opciones, valorDe, nuevoAzar, estacionDeLaFecha, sesion: () => sesion, ajustes: () => ajustes, animando: () => animando,
                modelo: () => partes && partes.modelo, dichos: () => dichos, estacion: () => estacionActual() };
</script>
